name: Publish the Hebrew site

on:
  push:
    branches: [main]
    paths: ["site/**", "videos/*/renders/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Add the newest render of each video
        run: |
          mkdir -p site/videos
          for d in videos/*/renders; do
            f=$(ls "$d"/*.mp4 2>/dev/null | sort | tail -1)
            [ -n "$f" ] && cp "$f" "site/videos/$(basename "$(dirname "$d")").mp4"
          done
          ls -la site/videos
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
