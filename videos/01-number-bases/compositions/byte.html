<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; background-color: #E4F2EC;
      background-image:
        linear-gradient(#9CCFC0 3px, transparent 3px), linear-gradient(90deg, #9CCFC0 3px, transparent 3px),
        linear-gradient(#C4E3D9 1px, transparent 1px), linear-gradient(90deg, #C4E3D9 1px, transparent 1px);
      background-size: 60px 60px, 60px 60px, 20px 20px, 20px 20px;
      font-family: 'IBM Plex Mono', monospace; color: #0B2A30; }
    .s3-stage { position: absolute; inset: 0; }

    .s3-tile { position: absolute; left: 192px; top: 240px; width: 640px; height: 600px; background: #FF5A1F; color: #fff;
      border: 12px solid #0B2A30; box-shadow: 18px 18px 0 #0B2A30; font-size: 440px; font-weight: 700; line-height: 576px; text-align: center; }
    .s3-wrong { position: absolute; left: 960px; top: 300px; font-family: 'Archivo Black', sans-serif; font-size: 110px; line-height: 1; color: #6A9188; }
    .s3-strike { position: absolute; left: -16px; right: -16px; top: 52%; height: 14px; background: #0B2A30; }
    .s3-base { position: absolute; left: 960px; top: 470px; font-size: 54px; font-weight: 700; color: #2E6B63; }
    .s3-right { position: absolute; left: 960px; top: 580px; font-family: 'Archivo Black', sans-serif; font-size: 230px; line-height: 1; }
  </style>
  <div id="root" data-composition-id="byte" data-width="1920" data-height="1080">
    <div id="s3-stage" class="clip s3-stage" data-start="0" data-duration="9.6">
      <div id="s3-tile" class="s3-tile">64</div>
      <div id="s3-wrong" class="s3-wrong">sixty-four<span id="s3-strike" class="s3-strike"></span></div>
      <div class="s3-base"><span id="s3-base">hexadecimal</span><span id="s3-base2"> &middot; base 16</span></div>
      <div id="s3-right" class="s3-right">= 100</div>
    </div>
  </div>
  <script>
    const tl = gsap.timeline({ paused: true });
    const blurIn = (sel, t, d = 0.2) =>
      tl.fromTo(sel, { opacity: 0, filter: "blur(10px)" }, { opacity: 1, filter: "blur(0px)", duration: d, ease: "power2.out" }, t);
    const blurOut = (sel, t, d = 0.2) => tl.to(sel, { opacity: 0, filter: "blur(8px)", duration: d, ease: "power2.in" }, t);
    const land = (sel, t, from = 1.3, d = 0.35) =>
      tl.fromTo(sel, { opacity: 0, scale: from }, { opacity: 1, scale: 1, duration: d, ease: "expo.out" }, t);

    // the byte arrives from where the wall left it
    tl.fromTo("#s3-tile", { x: 999, y: -110, scale: 0.93 }, { x: 0, y: 0, scale: 1, duration: 0.7, ease: "expo.out" }, 0);
    blurIn("#s3-wrong", 2.7);
    gsap.set("#s3-strike", { transformOrigin: "0 50%" });
    tl.fromTo("#s3-strike", { scaleX: 0 }, { scaleX: 1, duration: 0.25, ease: "power3.out" }, 3.5);
    blurIn("#s3-base", 4.3);
    blurIn("#s3-base2", 5.4);
    land("#s3-right", 7.85);
    // words leave, the tile travels up to head the next shot
    blurOut(["#s3-wrong", "#s3-base", "#s3-base2", "#s3-right"], 8.95);
    tl.to("#s3-tile", { x: 448, y: -290, scaleX: 0.47, scaleY: 0.4, duration: 0.5, ease: "power2.inOut" }, 9.08);

    window.__timelines["byte"] = tl;
  </script>
